<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/clientpage.css">
    <title>Document</title>
</head>
<body>

    <div class="header">
        <div class="logo">
            <img src="./images/logo.jpg" height="80px" width="80px" alt="Logo">
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            
            
            <!-- Where -->
            <div>
                <label class="d-block fw-bold" for="where">Where</label>
                <input id="where" type="text" placeholder="Search destinations">
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Check In -->
            <div>
                <label class="d-block fw-bold" for="checkin">Check in</label>
                <input id="checkin" type="text" placeholder="Add dates">
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Check Out -->
            <div>
                <label class="d-block fw-bold" for="checkout">Check out</label>
                <input id="checkout" type="text" placeholder="Add dates">
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Guests -->
            <div>
                <label class="d-block fw-bold" for="guests">Who</label>
                <input id="guests" type="text" placeholder="Add guests">
            </div>

            <!-- Search Button -->
            <button class="search-button">
                <i class="bi bi-search"></i> <!-- Bootstrap icon -->
            </button>
        </div>

        
        <div class="">
            <a class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  My Profile
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item" href="#">Create Account</a></li>
                  <li><a class="dropdown-item" href="#">Sign in</a></li>
                </ul>
              </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>

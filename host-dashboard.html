<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="#" id="logout">Log Out</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Your Properties</h2>
        <form id="property-form">
            <label for="title">Title:</label>
            <input type="text" id="title" required>
            <label for="description">Description:</label>
            <textarea id="description" required></textarea>
            <label for="price">Price per Night:</label>
            <input type="number" id="price" required>
            <button type="submit">Add Property</button>
        </form>
        <div id="property-list"></div>
    </main>
    <footer>
        <p>&copy; 2024 Residential Rentals. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { addPropertyListing, fetchHostProperties, auth } from './js/app.js';

        const propertyForm = document.getElementById('property-form');
        const propertyList = document.getElementById('property-list');

        propertyForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const price = parseFloat(document.getElementById('price').value);

            try {
                const user = auth.currentUser;
                if (!user) throw new Error('User not logged in');

                await addPropertyListing(title, description, price, '', 0, 0, user.uid);
                alert('Property added successfully!');
                propertyForm.reset();
                loadProperties(user.uid);
            } catch (error) {
                console.error('Error adding property:', error.message);
            }
        });

        const loadProperties = async (hostId) => {
            try {
                const properties = await fetchHostProperties(hostId);
                propertyList.innerHTML = '';
                properties.forEach((property) => {
                    const propertyItem = document.createElement('div');
                    propertyItem.innerHTML = `
                        <h3>${property.title}</h3>
                        <p>${property.description}</p>
                        <p>Price: $${property.price}</p>
                    `;
                    propertyList.appendChild(propertyItem);
                });
            } catch (error) {
                console.error('Error loading properties:', error.message);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const user = auth.currentUser;
            if (user) loadProperties(user.uid);
        });
    </script>
</body>
</html>

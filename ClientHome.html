<!DOCTYPE html>
<html lang="en">
<head>

    <div class="header">
        <div class="logo">
            <img src="./images/logo.jpg" height="80px" width="80px" alt="Logo">
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            
            
            <!-- Where -->
            <div>
                <label class="d-block fw-bold" for="where">Where</label>
                <input id="where" type="text" placeholder="Search destinations">
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Check In -->
            <div>
                <label class="d-block fw-bold" for="checkin">Check in
                    </label>
                <input id="checkin" type="date" placeholder="Add dates">
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Check Out -->
            <div>
                <label class="d-block fw-bold" for="checkout">Check out</label>
                <input id="checkout" type="date" placeholder="Add dates">
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Guests -->
            <div>
                <label class="d-block fw-bold" for="guests">Who</label>
                <input id="guests" type="text" placeholder="Add guests">
            </div>

            <!-- Search Button -->
            <button class="search-button" onclick="myFunction()">

            </button>
        </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="../css/user-portal-styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html">logout</a></li>

                <li><a href="support.html">Support</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Available Properties</h1>
        <div id="search-container">
            <input type="text" id="search-bar" placeholder="Search by location, price, or rooms..." />
            <button id="search-button">Search</button>
        </div>
        <div id="properties-container">
            <!-- Property listings will be dynamically loaded here -->
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Residential Rentals. All Rights Reserved.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

    <!-- Custom Scripts -->
    <script type="module" src="../js/user-portal.js"></script>

    <style>
        #search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #search-bar {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
        }

        #search-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .property-card {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .property-card h3 {
            margin-top: 0;
        }

        .btn-rent, .btn-favorite, .btn-chat {
            margin: 5px;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-favorite.favorited {
            color: gold;
        }

        .rented-status {
            color: red;
            font-weight: bold;
        }
    </style>
</body>
</html>

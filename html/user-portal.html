    <main>
        <h1>Available Properties</h1>
        <div id="search-container">
            <input type="text" id="search-bar" placeholder="Search by location, price, or rooms..." />
            <button id="search-button">Search</button>

    <style>
        #search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #search-bar {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
        }

        #search-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .property-card {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .property-card h3 {
            margin-top: 0;
        }

        .btn-rent, .btn-favorite, .btn-chat {
            margin: 5px;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-favorite.favorited {
            color: gold;
        }

        .rented-status {
            color: red;
            font-weight: bold;

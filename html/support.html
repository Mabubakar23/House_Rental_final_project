//support.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/support-styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="signin.html">Sign In</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
            <li><button id="theme-toggle">Toggle Theme</button></li>
        </nav>
    </header>
    <main>
        <section class="support-section">
            <h1>Contact Support</h1>
            <p>If you have any questions, issues, or feedback, please let us know. Our support team will get back to you as soon as possible.</p>
            <form id="support-form" class="form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="Enter subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Residential Rentals. All Rights Reserved.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

    <!-- Custom Scripts -->
    <script type="module" src="../js/theme.js"></script>
    <script type="module">
        import { addSupportMessage } from '../js/app.js';

        document.getElementById('support-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !subject || !message) {
                alert('Please fill in all fields.');
                return;
            }

            try {
                await addSupportMessage(name, email, subject, message);
                alert('Your message has been sent successfully!');
                document.getElementById('support-form').reset();
            } catch (error) {
                alert('Error sending message: ' + error.message);
            }
        });
    </script>
</body>
</html>

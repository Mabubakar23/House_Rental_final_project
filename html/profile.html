<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="host-properties.html">Owner's Portal</a></li>
                <li><a href="user-portal.html">Rental Portal</a></li>
                <li><a href="signin.html">Login</a></li>
                <li><a href="signup.html">Sign up</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="support.html">Support</a></li>
                <li><a href="#" id="logout">Log Out</a></li>            </ul>
        </nav>
    </header>      
    <main>
        <h2>Profile Page</h2>
        <div class="profile-container">
            <form id="profile-form">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
    
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required disabled>
    
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="Enter your phone number">
    
                <label for="bio">Bio</label>
                <textarea id="bio" placeholder="Tell us about yourself"></textarea>

                <div class="profile-picture" style="display: flex; align-items: center; gap: 10px;">
                    <img id="profile-img" src="/images/profile-default.svg" alt="Profile Picture" style="width: 80px; height: 80px; border-radius: 50%; border: 1px solid #ccc;">
                    <input type="file" id="profile-picture-input" name="profile-picture-input" accept="image/*">
                    <button type="button" id="upload-picture-btn">Upload Picture</button>
                </div>

                <button type="submit" style="margin: 10px auto;">Save Changes</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Residential Rentals. All Rights Reserved.</p>
    </footer>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>

    <!-- Link to External JavaScript File -->
    <script type="module" src="/js/profile.js"></script>
    <!-- Custom Scripts -->
    <script type="module">
        import { checkAuthStatus, logOut } from '/js/app.js';

        // Check authentication status on page load
        checkAuthStatus();

        // Add event listener for Log Out
        document.getElementById('logout').addEventListener('click', (e) => {
            e.preventDefault();
            logOut();
        });
    </script>    
</body>
</html>

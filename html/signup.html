<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/signup-styles.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="signin.html">Sign In</a></li>
                <li><a href="support.html">Support</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Create an Account</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="role">Select Role:</label>
                    <select id="role" required>
                        <option value="user">User</option>
                        <option value="owner">Owner</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
            <p>Already have an account? <a href="signin.html">Sign in here</a></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Residential Rentals. All Rights Reserved.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script type="module" src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>

    <!-- Firebase Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJGhK05gIL-hnl_HJubmj16dIuiP0q4JU",
            authDomain: "residential-rental-hospitality.firebaseapp.com",
            projectId: "residential-rental-hospitality",
            storageBucket: "residential-rental-hospitality.firebasestorage.app",
            messagingSenderId: "716299420732",
            appId: "1:716299420732:web:2fb4e70235178bb0922f39",
            measurementId: "G-GGC25RS2EY"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
    </script>

    <!-- Custom Script -->
    <script type="module">
        import { signUp } from '../js/app.js';

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const role = document.getElementById('role').value;
            signUp(email, password, role);
        });
    </script>
</body>
</html>

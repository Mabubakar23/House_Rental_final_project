<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="host-properties.html">Owner's Portal</a></li>
                <li><a href="user-portal.html">Rental Portal</a></li>
                <li><a href="signin.html">Login</a></li>
                <li><a href="signup.html">Sign up</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="support.html">Support</a></li>
                <li><a href="#" id="logout">Log Out</a></li>
            </ul>
        </nav>
    </header>   
    <main>
        <div class="container">
            <h2>Create an Account</h2>
            <form id="signup-form" style="width: 50%; margin: auto;">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="role">Select Role:</label>
                    <select id="role" required>
                        <option value="user">User</option>
                        <option value="owner">Owner</option>
                    </select>
                    <button type="submit" class="btn-primary">Sign Up</button>
                </div>
            </form>
            <p>Already have an account? <a href="signin.html">Sign in here</a></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Residential Rentals. All Rights Reserved.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>

    <!-- Custom Script -->
    <script type="module">
        import { signUp } from '/js/app.js';

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const role = document.getElementById('role').value;
            signUp(email, password, role);
        });
    </script>
    <!-- Custom Scripts -->
    <script type="module">
        import { checkAuthStatus, logOut } from '/js/app.js';

        // Check authentication status on page load
        checkAuthStatus();

        // Add event listener for Log Out
        document.getElementById('logout').addEventListener('click', (e) => {
            e.preventDefault();
            logOut();
        });
    </script>    
</body>
</html>
